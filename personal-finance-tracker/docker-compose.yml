version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # For development, uncomment the volumes section:
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    # environment:
    #   - NODE_ENV=development
    # command: npm start
